<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://releases.transloadit.com; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com https://*.stripe.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://js.stripe.com https://*.stripe.com https://hooks.stripe.com;" />
    
    <title>TermFlow | AI Lettings Automation for Student Accommodation (PBSA)</title>
    <meta name="description" content="Automate your PBSA lettings with AI. Handle 400+ enquiries/week, book viewings, sign contracts automatically. GDPR-compliant. From £99/month. 14-day free trial." />
    <meta name="keywords" content="AI lettings automation, student accommodation software, PBSA CRM, automated student lettings" />
    
    <!-- DNS Prefetch & Preconnect for Performance -->
    <link rel="dns-prefetch" href="https://js.stripe.com">
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://releases.transloadit.com">
    
    <link rel="preconnect" href="https://js.stripe.com">
    <link rel="preconnect" href="https://www.googletagmanager.com">
    
    <!-- Self-hosted Inter fonts for optimal performance (96 KB total) -->
    <!-- Preload weights used in hero (400, 600, 700) for optimal LCP -->
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- Deferred Uppy CSS - Non-critical -->
    <link 
      rel="preload" 
      href="https://releases.transloadit.com/uppy/v3.23.0/uppy.min.css" 
      as="style" 
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link rel="stylesheet" href="https://releases.transloadit.com/uppy/v3.23.0/uppy.min.css">
    </noscript>
    
    <!-- Critical CSS - Inlined for instant rendering (<14 KB) -->
    <style>
      /* Self-hosted fonts with CLS mitigation - ACTIVE */
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        ascent-override: 90%;
        descent-override: 22%;
        line-gap-override: 0%;
        size-adjust: 107%;
        unicode-range: U+0020-007F, U+00A0-00FF;
      }
      
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
        ascent-override: 90%;
        descent-override: 22%;
        line-gap-override: 0%;
        size-adjust: 107%;
        unicode-range: U+0020-007F, U+00A0-00FF;
      }
      
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
        ascent-override: 90%;
        descent-override: 22%;
        line-gap-override: 0%;
        size-adjust: 107%;
        unicode-range: U+0020-007F, U+00A0-00FF;
      }
      
      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        ascent-override: 90%;
        descent-override: 22%;
        line-gap-override: 0%;
        size-adjust: 107%;
        unicode-range: U+0020-007F, U+00A0-00FF;
      }
      
      /* Critical above-the-fold styles */
      :root {
        --tf-navy: 220 49% 16%;
        --tf-lime: 83 88% 53%;
        --tf-bg: 210 17% 98%;
        --background: 210 17% 98%;
        --foreground: 220 49% 16%;
        --card: 0 0% 100%;
        --card-foreground: 220 49% 16%;
        --muted: 220 10% 90%;
        --muted-foreground: 215 16% 47%;
        --primary: 220 49% 16%;
        --primary-foreground: 0 0% 100%;
        --radius: 0.5rem;
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.5;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Loading spinner for immediate feedback */
      .loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: hsl(var(--background));
      }
      
      .spinner {
        width: 2rem;
        height: 2rem;
        border: 4px solid hsl(var(--tf-navy));
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Prevent layout shift - Images & Aspect Ratios */
      img, picture {
        max-width: 100%;
        height: auto;
        display: block;
      }
      
      .aspect-video {
        aspect-ratio: 16 / 9;
      }
      
      .aspect-square {
        aspect-ratio: 1 / 1;
      }
      
      .aspect-portrait {
        aspect-ratio: 3 / 4;
      }
      
      /* Critical button styles (prevents FOUC) */
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        outline: none;
      }
      
      /* Critical card/container styles */
      .container {
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }
      
      @media (min-width: 640px) {
        .container {
          max-width: 640px;
        }
      }
      
      @media (min-width: 768px) {
        .container {
          max-width: 768px;
        }
      }
      
      @media (min-width: 1024px) {
        .container {
          max-width: 1024px;
        }
      }
      
      @media (min-width: 1280px) {
        .container {
          max-width: 1280px;
        }
      }
      
      @media (min-width: 1536px) {
        .container {
          max-width: 1536px;
        }
      }
      
      /* Prevent flash of unstyled content */
      [class*="animate-"] {
        animation-duration: 0.3s;
        animation-timing-function: ease-in-out;
      }
      
      /* Hero section critical styles */
      section {
        position: relative;
      }
      
      h1, h2, h3, h4, h5, h6 {
        margin: 0;
        font-weight: 600;
        line-height: 1.2;
      }
      
      h1 {
        font-size: 2.25rem;
        font-weight: 700;
      }
      
      @media (min-width: 768px) {
        h1 {
          font-size: 3.75rem;
        }
      }
      
      p {
        margin: 0;
      }
      
      /* Critical flex utilities */
      .flex {
        display: flex;
      }
      
      .items-center {
        align-items: center;
      }
      
      .justify-center {
        justify-content: center;
      }
      
      .flex-col {
        flex-direction: column;
      }
      
      .gap-4 {
        gap: 1rem;
      }
      
      .gap-6 {
        gap: 1.5rem;
      }
      
      /* Critical text utilities */
      .text-center {
        text-align: center;
      }
      
      .font-bold {
        font-weight: 700;
      }
      
      .font-semibold {
        font-weight: 600;
      }
      
      /* Critical spacing utilities */
      .mt-4 { margin-top: 1rem; }
      .mt-6 { margin-top: 1.5rem; }
      .mt-8 { margin-top: 2rem; }
      .mb-4 { margin-bottom: 1rem; }
      .mb-6 { margin-bottom: 1.5rem; }
      .mb-8 { margin-bottom: 2rem; }
      .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
      .py-16 { padding-top: 4rem; padding-bottom: 4rem; }
      .py-20 { padding-top: 5rem; padding-bottom: 5rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant loading feedback -->
      <div class="loading-spinner" id="app-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loader once app mounts
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var loader = document.getElementById('app-loader');
          if (loader && loader.parentNode) {
            loader.remove();
          }
        }, 100);
      });
    </script>
  </body>
</html>
